<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes partiels</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#eef1f7;--card:#fff;--ink:#1b2340;--mute:#68718e;--line:#dde2ee;--calm:#2f5bd8;--calm-bg:#e4ebff;--soon:#b86a00;--soon-bg:#ffe9bf;--hot:#c4281c;--hot-bg:#ffdad5;--ok:#1f8a5b;--acc:#ffd84d;--head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;--body:'DM Sans',system-ui,-apple-system,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1426;--card:#1a2140;--ink:#eef1ff;--mute:#9aa3c4;--line:#2a3359;--calm:#8fb0ff;--calm-bg:#23305f;--soon:#ffc766;--soon-bg:#4a3510;--hot:#ff8f84;--hot-bg:#4d1d1a;--ok:#5ad59b}}
:root[data-theme="dark"]{--bg:#0f1426;--card:#1a2140;--ink:#eef1ff;--mute:#9aa3c4;--line:#2a3359;--calm:#8fb0ff;--calm-bg:#23305f;--soon:#ffc766;--soon-bg:#4a3510;--hot:#ff8f84;--hot-bg:#4d1d1a;--ok:#5ad59b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body)}
main{max-width:600px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font:800 30px/1.05 var(--head);margin:6px 0;letter-spacing:-.02em}
h2{font:600 15px var(--head);color:var(--mute);margin:20px 0 8px}
.sub{color:var(--mute);margin:0 0 14px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.pill{background:var(--acc);color:#1b2340;border:0;border-radius:22px;height:44px;padding:0 14px;font-weight:700}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:40px;padding:0 12px;font-weight:600}
.btn.d{color:var(--hot)}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c,#2f5bd8);border-radius:16px;padding:12px;margin-bottom:10px}
.card.past{opacity:.7}
.top{display:grid;grid-template-columns:68px 1fr;gap:12px;align-items:center;cursor:pointer}
.cd{border-radius:12px;padding:8px 2px;text-align:center;font-family:var(--head);background:var(--calm-bg);color:var(--calm)}
.cd b{display:block;font-size:26px;line-height:1;font-weight:800}.cd span{font-size:11px;font-weight:600}
.cd.soon{background:var(--soon-bg);color:var(--soon)}.cd.hot{background:var(--hot-bg);color:var(--hot)}.cd.g{background:var(--line);color:var(--mute)}
.name{font:800 18px/1.2 var(--head);margin:0}.meta{color:var(--mute);font-size:13px;margin:2px 0 0}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px 0 2px}.bar i{display:block;height:100%;background:var(--ok)}
.t{display:flex;gap:10px;align-items:center;min-height:40px;font-size:15px}
.t input{width:20px;height:20px;accent-color:var(--ok);flex:none}.t.on span{text-decoration:line-through;color:var(--mute)}
.t small{color:var(--mute);margin-left:auto;white-space:nowrap}
.det{border-top:1px solid var(--line);margin-top:10px;padding-top:6px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.warn{background:var(--hot-bg);color:var(--hot);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;font-weight:500}
.empty{text-align:center;color:var(--mute);padding:36px 16px;border:2px dashed var(--line);border-radius:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:4}
.tabs button{flex:1;border:0;background:none;height:56px;font-size:12px;color:var(--mute);font-weight:600}.tabs button.on{color:var(--calm)}
.tabs button span{display:block;font-size:20px;line-height:1}
.bg{position:fixed;inset:0;background:rgba(10,14,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:6}.bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:94%;overflow:auto}
.sheet h3{font:800 21px var(--head);margin:0 0 6px}
label.l{display:block;font-weight:600;font-size:14px;margin:10px 0 3px}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px}
input[type=color]{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:3px}
textarea{min-height:78px;resize:vertical}.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.err{color:var(--hot);font-size:14px;min-height:18px;margin:6px 0}
.bt{display:flex;gap:10px}.bt button{flex:1;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-weight:700}.bt .ok{background:var(--ink);color:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:14px;display:none;gap:14px;align-items:center;z-index:7;font-size:15px;max-width:92%}.toast.show{display:flex}.toast button{background:none;border:0;color:var(--acc);font-weight:700}
.pomo{text-align:center}.pomo .tm{font:800 54px/1 var(--head);margin:6px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal .h{font-size:12px;color:var(--mute);font-weight:600}
.day{aspect-ratio:1;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:14px;padding:3px;display:flex;flex-direction:column;align-items:center;gap:2px}
.day.sel{outline:3px solid var(--calm)}.day.now{font-weight:800;border-color:var(--calm)}.day.x{visibility:hidden}
.day i{width:8px;height:8px;border-radius:50%;display:inline-block;margin:0 1px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st .card b{font:800 26px var(--head);display:block}.st .card span{color:var(--mute);font-size:13px}
.c7{display:flex;align-items:flex-end;gap:6px;height:80px}.c7 div{flex:1;background:var(--calm-bg);border-radius:6px 6px 0 0;min-height:3px;position:relative}.c7 div i{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:10px;color:var(--mute);font-style:normal}
.big{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:18px;margin-bottom:12px;font:800 22px var(--head);display:flex;justify-content:space-between;align-items:center}.big small{font:400 14px var(--body);color:var(--mute);display:block;margin-top:2px}.big:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--calm)}:focus-visible{outline:3px solid var(--calm);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<main><header><div><h1 id="ti">Aujourd’hui</h1></div><div style="display:flex;gap:8px"><button class="pill" id="add">+ Partiel</button><button class="pill" id="addtp" style="background:var(--ink);color:var(--bg)">+ TP</button></div></header><p class="sub" id="sub"></p><div id="v"></div></main>
<nav class="tabs" id="tabs"><button data-t="year"><span>🎓</span>Année</button><button data-t="today"><span>☀</span>Accueil</button><button data-t="exams"><span>☰</span>Partiels</button><button data-t="tp"><span>🧪</span>TP</button><button data-t="cal"><span>▦</span>Agenda</button><button data-t="stats"><span>◔</span>Stats</button></nav>
<div class="bg" id="bg"><div class="sheet" role="dialog" aria-modal="true">
<h3 id="st">Nouveau partiel</h3>
<label class="l" for="f-sel">Matière</label><select id="f-sel"></select><input type="text" id="f-name" hidden autocomplete="off" placeholder="Nom de la matière" style="margin-top:8px">
<div class="r2"><div><label class="l" for="f-cat">Bloc</label><select id="f-cat"></select></div><div><label class="l" for="f-col">Couleur</label><input type="color" id="f-col" value="#2f5bd8"></div></div>
<div id="rw-ttl" style="display:none"><label class="l" for="f-ttl">Titre du TP (facultatif)</label><input type="text" id="f-ttl" autocomplete="off" placeholder="Ex. TP2 – Filtrage"></div><div class="r2"><div><label class="l" for="f-date" id="lb-date">Date du partiel</label><input type="date" id="f-date"></div><div><label class="l" for="f-time">Heure</label><input type="time" id="f-time"></div></div>

<div class="r2" id="rw-cp"><div><label class="l" for="f-coef">Coef.</label><input type="number" id="f-coef" min="0.5" step="0.5" value="1"></div><div><label class="l" for="f-prio">Priorité</label><select id="f-prio"><option value="1">Basse</option><option value="2" selected>Normale</option><option value="3">Haute</option></select></div></div>
<label class="l" id="lb-top" for="f-top">À réviser (un par ligne, durée en min après « | »)</label><textarea id="f-top" placeholder="Chapitre 1 | 45&#10;Fiches de TD | 30"></textarea><button class="btn" id="tpl" type="button" style="margin-top:6px">+ Étapes types (cours, fiche, TD, annales)</button>
<label class="l" for="f-notes">Notes</label><textarea id="f-notes"></textarea>
<label class="l" for="f-links">Liens (un par ligne)</label><textarea id="f-links" placeholder="https://..."></textarea>
<p class="err" id="err" role="alert"></p><div class="bt"><button id="cancel">Annuler</button><button class="ok" id="save">Enregistrer</button></div></div></div>
<div class="toast" id="toast"><span id="tm"></span><button id="undo" hidden>Annuler</button></div>
<script>
(function(){
var K='partiels-v2',S={exams:[],data:{},cur:null,act:{},study:{},theme:'auto',budget:120},tab='year',ys=null,fk='exam',open={},editId=null,last=null,tt,calM=new Date(),selDay=null,DL=null,q='',fcat='';
var P=new Date;calM=new Date(P.getFullYear(),P.getMonth(),1);
var $=function(i){return document.getElementById(i)},p2=function(n){return(n<10?'0':'')+n};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function td(){return ymd(new Date)}
function pd(s){var p=s.split('-');return new Date(+p[0],p[1]-1,+p[2])}
function dl(s){if(!s)return null;var n=new Date;return Math.round((pd(s)-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5)}
function fd(s){if(!s)return'Date à définir';return pd(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function norm(e){var d={cat:'',color:'#2f5bd8',coef:1,prio:2,target:'',grade:'',notes:'',links:'',time:'',place:'',topics:[]};for(var k in d)if(e[k]==null)e[k]=d[k];return e}
var PRE={F1S1:[['Mathématiques','#2f5bd8',[['Probabilités',38],['Calcul numérique',27],['Traitement du signal',35]]],['Optique','#8e3fd0',[['Chaîne d’acquisition',32],['Ingénierie de la vision',34],['Introduction générale à l’optique photonique',34]]],['Physique','#e07a1f',[['EM dans le vide',43],['EM dans la matière',35],['Métrologie et capteurs',22]]],['Numérique','#1f9d6b',[['Langage C',35],['Architecture SI',27],['Bases des réseaux',19],['Télécommunications',19]]]]};
function seed(k){var o=[];(PRE[k]||[]).forEach(function(b){b[2].forEach(function(m,i){o.push(norm({id:k+'-'+b[0].slice(0,3)+i,name:m[0],cat:b[0],color:b[1],coef:m[1],pct:1,date:'',topics:[]}))})});return o}
function setSem(k){S.cur=k;if(!S.data[k])S.data[k]={exams:seed(k)};S.exams=S.data[k].exams=S.data[k].exams.map(norm)}
var BC={F1S1:{'Mathématiques':11,'Physique':6,'Optique':6,'Numérique':5}};
function bc(c){return(BC[S.cur]||{})[c]||0}
function wt(e){return e.kind==='tp'?150:e.coef*(bc(e.cat)||1)}
function dn(e){return e.kind==='tp'?'TP '+e.name+(e.title?' – '+e.title:''):e.name}
function ctx(){return S.cur?'FISE '+S.cur[1]+' • Semestre '+S.cur[3]:''}
function load(){try{var r=localStorage.getItem(K),o=r?JSON.parse(r):null;if(!o){var v=localStorage.getItem('partiels-v1');if(v)o={exams:JSON.parse(v)}}if(o){var old=o.exams;delete o.exams;S=Object.assign(S,o);if(old&&old.length){if(!S.data.F1S1)S.data.F1S1={exams:seed('F1S1')};S.data.F1S1.exams=S.data.F1S1.exams.concat(old)}}}catch(e){}S.exams=[];if(S.cur)setSem(S.cur);theme()}
function save(){try{var c=Object.assign({},S);delete c.exams;localStorage.setItem(K,JSON.stringify(c))}catch(e){}}
function theme(){var r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme)}
function toast(m,u){$('tm').textContent=m;$('undo').hidden=!u;$('toast').classList.add('show');clearTimeout(tt);tt=setTimeout(function(){$('toast').classList.remove('show');last=null},5000)}
function up(){return S.exams.filter(function(e){return e.date&&dl(e.date)>=0})}
function bAvg(c){var a=0,w=0;S.exams.forEach(function(e){if((e.cat||'Autres')===c&&e.grade!==''){a+=e.grade*e.coef;w+=+e.coef}});return w?a/w:null}
function mark(n){S.act[td()]=(S.act[td()]||0)+n}
function streak(){var d=new Date,n=0;if(!S.act[ymd(d)])d.setDate(d.getDate()-1);while(S.act[ymd(d)]){n++;d.setDate(d.getDate()-1)}return n}
function prog(e){var t=e.topics.length,d=e.topics.filter(function(x){return x.done}).length;return{t:t,d:d,p:t?Math.round(d/t*100):0}}
function cdBox(e){if(!e.date)return'<div class="cd g"><b>?</b><span>date</span></div>';var n=dl(e.date),p=n<0,c=p?'g':n<=3?'hot':n<=14?'soon':'';return'<div class="cd '+c+'"><b>'+(p?'Fini':n===0?'Auj.':n===1?'Demain':'J-'+n)+'</b><span>'+(p?'passé':n>1?'jours':'')+'</span></div>'}
function plan(e){var n=Math.max(dl(e.date),1),und=e.topics.filter(function(x){return!x.done}),dn=e.topics.filter(function(x){return x.doneOn===td()}),q=Math.max(Math.ceil((und.length+dn.length)/n)-dn.length,0);return{todo:und.slice(0,q),done:dn,rem:und.length,n:n}}
function late(e){if(!e.date)return false;var d=dl(e.date),pr=prog(e);return d>=0&&d<=7&&pr.t&&pr.d/pr.t<.5&&(1-pr.d/pr.t)>(d/14)}
function gcal(e){var d=e.date.replace(/-/g,''),n=new Date(pd(e.date).getTime()+864e5),dd=e.time?d+'T'+e.time.replace(':','')+'00/'+d+'T'+p2(Math.min(+e.time.split(':')[0]+2,23))+e.time.split(':')[1]+'00':d+'/'+ymd(n).replace(/-/g,'');return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent((e.kind==='tp'?'TP : ':'Partiel : ')+dn(e))+'&dates='+dd+'&location='+encodeURIComponent(e.place||'')}
function links(e){return e.links.split('\n').map(function(s){return s.trim()}).filter(function(s){return/^https?:\/\//i.test(s)}).map(function(s){return'<a href="'+esc(s)+'" target="_blank" rel="noopener">'+esc(s.replace(/^https?:\/\//,'').slice(0,40))+'</a>'}).join('<br>')}
function chk(e,showAll,list){return list.map(function(x){var i=e.topics.indexOf(x);return'<label class="t'+(x.done?' on':'')+'"><input type="checkbox" data-id="'+e.id+'" data-i="'+i+'"'+(x.done?' checked':'')+'><span>'+esc(x.t)+'</span>'+(x.min?'<small>'+x.min+' min</small>':'')+'</label>'}).join('')}
/* vues */
function vToday(){
  var u=up().sort(function(a,b){return wt(b)*b.prio/(dl(b.date)+1)-wt(a)*a.prio/(dl(a.date)+1)});
  var h='<div class="card pomo"><select id="po-ex" aria-label="Matière">'+u.map(function(e){return'<option value="'+e.id+'"'+(PO.ex===e.id?' selected':'')+'>'+esc(dn(e))+'</option>'}).join('')+'</select><div class="tm" id="po-t">'+fmt(PO.left)+'</div><div class="acts" style="justify-content:center"><button class="btn" data-a="po">'+(PO.run?'Pause':'Démarrer 25 min')+'</button><button class="btn" data-a="por">Réinitialiser</button></div></div>';
  var rv=[];S.exams.forEach(function(e){if(e.date&&dl(e.date)<0)return;e.topics.forEach(function(t,i){(t.rv||[]).forEach(function(r,k){if(!r.ok&&r.d<=td())rv.push('<label class="t"><input type="checkbox" data-rv="'+e.id+'|'+i+'|'+k+'"><span>'+esc(t.t)+'</span><small>'+esc(e.name)+'</small></label>')})})});
  if(rv.length)h+='<h2>À revoir ('+rv.length+')</h2><div class="card">'+rv.join('')+'</div>';
  if(!u.length)return h+'<div class="empty" style="margin-top:12px">'+(S.exams.some(function(e){return!e.date})?'Aucune date de partiel renseignée.<br>Va dans l’onglet Partiels, touche une matière puis « Modifier » pour saisir sa date.':'Aucun partiel à venir.<br>Ajoute-en un avec « + Partiel ».')+'</div>';
  var tot=0,body='',bd=S.budget||120,sm=0;u.forEach(function(e){sm+=wt(e)*e.prio/(dl(e.date)+1)});var rec=function(e){return Math.max(5,Math.round(bd*(wt(e)*e.prio/(dl(e.date)+1))/sm/5)*5)};
  u.forEach(function(e){var pl=plan(e);if(late(e))h+='<div class="warn">⚠ '+esc(dn(e))+' : il reste '+pl.rem+' point(s) à voir pour J-'+dl(e.date)+'. Il faut accélérer.</div>';
    var all=pl.done.concat(pl.todo);if(!all.length)return;pl.todo.forEach(function(x){tot+=x.min||0});
    body+='<div class="card" style="--c:'+e.color+'"><p class="name">'+esc(dn(e))+'</p><p class="meta">'+(dl(e.date)===0?(e.kind==='tp'?'TP':'Partiel')+' aujourd’hui':'J-'+dl(e.date)+' • '+pl.rem+' restant(s)')+' • ≈ '+rec(e)+' min conseillées</p>'+chk(e,1,all)+'</div>'});
  return h+'<h2>À faire aujourd’hui'+(tot?' • ≈ '+tot+' min':'')+'</h2>'+(body||'<div class="empty">Rien à faire aujourd’hui. Bien joué !</div>')}
function cardE(e){var pr=prog(e),o=open[e.id],gr=e.grade!==''?' • note '+e.grade+'/20':'';
  var h='<div class="card'+(e.date&&dl(e.date)<0?' past':'')+'" style="--c:'+e.color+'"><div class="top" data-o="'+e.id+'">'+cdBox(e)+'<div><p class="name">'+esc(dn(e))+'</p><p class="meta">'+(e.cat?esc(e.cat)+' • ':'')+fd(e.date)+(e.time?' '+e.time.replace(':','h'):'')+(e.place?' • '+esc(e.place):'')+'</p><p class="meta">'+(e.kind==='tp'?'Travaux pratiques':(e.pct?e.coef+' % du bloc':'coef '+e.coef)+' • '+['','basse','normale','haute'][e.prio]+gr)+'</p></div></div>';
  if(pr.t)h+='<div class="bar"><i style="width:'+pr.p+'%"></i></div><div class="meta">'+pr.d+'/'+pr.t+' révisés</div>';
  if(o){h+='<div class="det">'+chk(e,1,e.topics)+(e.notes?'<p class="meta" style="white-space:pre-wrap">'+esc(e.notes)+'</p>':'')+(links(e)?'<p class="meta">'+links(e)+'</p>':'')+
    (e.kind==='tp'?'':'<label class="l">Note obtenue /20</label><input type="number" min="0" max="20" step="0.25" data-g="'+e.id+'" value="'+esc(e.grade)+'" placeholder="Après l’examen">')+
    '<div class="acts"><button class="btn" data-ed="'+e.id+'">Modifier</button>'+(e.date?'<a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="'+gcal(e)+'" target="_blank" rel="noopener">Google Agenda</a>':'')+'<button class="btn" data-sh="'+e.id+'">Partager</button><button class="btn d" data-del="'+e.id+'">Supprimer</button></div></div>'}
  return h+'</div>'}
function vExams(){
  var cats=[];S.exams.forEach(function(e){if(e.cat&&cats.indexOf(e.cat)<0)cats.push(e.cat)});
  var h='<button class="btn" data-a="dates" style="margin-bottom:10px">📅 Saisir toutes les dates</button><input type="search" id="q" placeholder="Rechercher…" value="'+esc(q)+'" style="margin-bottom:8px">'+(cats.length?'<select id="fc" style="margin-bottom:8px"><option value="">Tous les blocs</option>'+cats.map(function(c){return'<option'+(c===fcat?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select>':'');
  if(!S.exams.length)return'<div class="empty">Aucune matière.<br>Appuie sur « + Partiel » pour en ajouter.</div>';
